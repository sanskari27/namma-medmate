spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:25432/nammamedmate}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=Asia/Kolkata

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=60
app.session.ttl-minutes=720
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.security.secure-cookie=false
app.security.cookie-name=nmm_access
app.security.device-cookie-name=nmm_device
app.security.device-cookie-days=365
app.saved-login.ttl-days=30
app.resend.api-key=${RESEND_API_KEY:}
app.resend.webhook-secret=${RESEND_WEBHOOK_SECRET:}
app.resend.from=${RESEND_FROM:Namma MedMate <noreply@nammamedmate.com>}
app.password-reset.ttl-minutes=60
app.password-reset.dispensary-url=${PASSWORD_RESET_DISPENSARY_URL:http://localhost:5173/reset-password}
app.password-reset.admin-url=${PASSWORD_RESET_ADMIN_URL:http://localhost:5174/reset-password}
app.email-verification.ttl-minutes=60
app.email-verification.dispensary-url=${EMAIL_VERIFICATION_DISPENSARY_URL:http://localhost:5173/verify-email}
nmm.kyc.storage-dir=${NMM_KYC_STORAGE_DIR:}
nmm.compliance.storage-dir=${NMM_COMPLIANCE_STORAGE_DIR:}
nmm.expense.storage-dir=${NMM_EXPENSE_STORAGE_DIR:}

server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

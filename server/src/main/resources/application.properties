spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:25432/nammamedmate}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=Asia/Kolkata

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-minutes=60
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
app.security.secure-cookie=false
app.security.cookie-name=nmm_access

server.port=8080
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized

# Host Nginx for compose.prod.yaml loopback ports.
# API 18080 · pharmacy (dispensary) 10080 · admin 10081
# TLS: one Let's Encrypt cert covering api + pharmacy + admin
# (live dir /etc/letsencrypt/live/namma-medmate/).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream namma_api {
    server 127.0.0.1:18080;
    keepalive 32;
}

upstream namma_pharmacy {
    server 127.0.0.1:10080;
}

upstream namma_admin {
    server 127.0.0.1:10081;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.nammamedmate.com pharmacy.nammamedmate.com admin.nammamedmate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.nammamedmate.com;

    ssl_certificate     /etc/letsencrypt/live/namma-medmate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namma-medmate/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://namma_api;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pharmacy.nammamedmate.com;

    ssl_certificate     /etc/letsencrypt/live/namma-medmate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namma-medmate/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://namma_pharmacy;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nammamedmate.com;

    ssl_certificate     /etc/letsencrypt/live/namma-medmate/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namma-medmate/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://namma_admin;
    }
}

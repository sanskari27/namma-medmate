# HTTP bootstrap for medmatepharmacy.com before its certificate exists.
# Installed beside namma-medmate.conf. Does not replace the ERP vhosts.

upstream medmate_website {
    server 127.0.0.1:10082;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name medmatepharmacy.com www.medmatepharmacy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://medmate_website;
    }
}

# Host Nginx for the pharmacy dashboard. Loopback port 10083.
# TLS cert name: namma-pharmacy (separate from medmatepharmacy.com).

upstream namma_pharmacy {
    server 127.0.0.1:10083;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pharmacy.nammamedmate.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pharmacy.nammamedmate.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pharmacy.nammamedmate.com;

    ssl_certificate     /etc/letsencrypt/live/namma-pharmacy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/namma-pharmacy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /_next/static/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://namma_pharmacy;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_pass http://namma_pharmacy;
    }
}

name: Main deploy
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    uses: ./.github/workflows/_reusable-detect-changes.yml

  build:
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        project: [dispensary-app-web, auth-api]
    uses: ./.github/workflows/_reusable-build.yml
    with:
      project: ${{ matrix.project }}

  terraform:
    needs: detect
    if: ${{ needs.detect.outputs.infra == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_reusable-terraform.yml
    with:
      environment: staging
      apply: true

  deploy-staging-web:
    needs: [detect, build]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_reusable-deploy-web.yml
    with:
      project: dispensary-app-web
      environment: staging

  deploy-staging-lambda:
    needs: [detect, build]
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [auth-api]
    uses: ./.github/workflows/_reusable-deploy-lambda.yml
    with:
      project: ${{ matrix.project }}
      environment: staging

  staging-pdt:
    needs: [deploy-staging-web, deploy-staging-lambda]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: curl --fail "${{ vars.STAGING_API_BASE_URL }}/health"
      - run: curl --fail "https://dispensary.staging.nammamedmate.com"

  deploy-prod-web:
    needs: staging-pdt
    if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_reusable-deploy-web.yml
    with:
      project: dispensary-app-web
      environment: prod

  deploy-prod-lambda:
    needs: staging-pdt
    if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project: [auth-api]
    uses: ./.github/workflows/_reusable-deploy-lambda.yml
    with:
      project: ${{ matrix.project }}
      environment: prod

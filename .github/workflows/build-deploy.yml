name: Build and Deploy

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy (e.g. v14 or feature)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deploy-prod]
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          clean: false
      - name: Pull compose env from SSM
        env:
          AWS_REGION: ap-south-1
        run: ./scripts/pull-prod-env.sh .env
      - name: Ensure swap
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile
          fi
          free -m
      - name: Build and restart
        run: |
          set -euo pipefail
          # t3.small has 2 GiB. A parallel Maven build plus two Vite builds
          # exhausts RAM and wedges the guest, which takes the runner offline.
          export COMPOSE_PARALLEL_LIMIT=1
          # One-time bootstrap container used before this service existed in compose.
          docker rm -f medmate-website >/dev/null 2>&1 || true
          docker compose -f compose.prod.yaml build server
          docker compose -f compose.prod.yaml build dispensary
          docker compose -f compose.prod.yaml build admin
          docker compose -f compose.prod.yaml build website
          if ! docker compose -f compose.prod.yaml up -d --wait server dispensary admin website; then
            docker compose -f compose.prod.yaml logs --tail=200 server dispensary admin website
            exit 1
          fi
      - name: Check API and SPAs
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:18080/actuator/health
          curl -fsS -o /dev/null http://127.0.0.1:10080/
          curl -fsS -o /dev/null http://127.0.0.1:10081/
          curl -fsS -o /dev/null http://127.0.0.1:10082/
      - name: Refresh host TLS / Nginx
        run: sudo ./scripts/setup-prod-tls.sh

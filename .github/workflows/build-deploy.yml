name: Build and Deploy

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deploy-prod]
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          clean: false
      - name: Pull compose env from SSM
        env:
          AWS_REGION: ap-south-1
        run: ./scripts/pull-prod-env.sh .env
      - name: Ensure swap
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
            fi
            sudo swapon /swapfile
          fi
          free -m
      - name: Build and restart
        run: |
          set -euo pipefail
          export COMPOSE_PARALLEL_LIMIT=1
          docker rm -f medmate-website >/dev/null 2>&1 || true
          docker compose -f compose.prod.yaml build website
          docker compose -f compose.prod.yaml build pharmacy
          if ! docker compose -f compose.prod.yaml up -d --wait website pharmacy; then
            docker compose -f compose.prod.yaml logs --tail=200 website pharmacy
            exit 1
          fi
      - name: Check website
        run: curl -fsS -o /dev/null http://127.0.0.1:10082/
      - name: Check pharmacy
        run: curl -fsS -o /dev/null http://127.0.0.1:10083/
      - name: Refresh host TLS / Nginx
        run: sudo ./scripts/setup-prod-tls.sh

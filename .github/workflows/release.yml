name: Main deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag to deploy (leave empty to cut a new release after CI)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  ci:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    uses: ./.github/workflows/ci-tests.yml

  release:
    needs: ci
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          git fetch --tags
          LATEST=$(git tag -l 'v[0-9]*' | sort -t'v' -k2 -n | tail -1)
          N=${LATEST#v}
          NEXT="v$(( ${N:-0} + 1 ))"
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes

  deploy:
    needs: [ci, release]
    if: ${{ always() && !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    uses: ./.github/workflows/build-deploy.yml
    with:
      tag: ${{ needs.release.outputs.tag || inputs.tag }}
    secrets: inherit

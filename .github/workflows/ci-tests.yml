name: CI Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      dispensary: ${{ steps.filter.outputs.dispensary }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
            dispensary:
              - 'dispensary/**'
            admin:
              - 'admin/**'

  server-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Run server tests
        working-directory: server
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: chmod +x mvnw && ./mvnw -B test

  dispensary-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.dispensary == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dispensary/package-lock.json
      - run: npm ci && npm run lint && npm run test -- --run && npm run build
        working-directory: dispensary

  admin-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci && npm run lint && npm run test -- --run && npm run build
        working-directory: admin

  ci-ok:
    needs: [detect-changes, server-tests, dispensary-checks, admin-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require changed app jobs to pass
        run: |
          set -euo pipefail
          check() {
            local name=$1 needed=$2 result=$3
            if [[ "$needed" == "true" && "$result" != "success" ]]; then
              echo "$name failed (result=$result)" >&2
              exit 1
            fi
          }
          check server "${{ needs.detect-changes.outputs.server }}" "${{ needs.server-tests.result }}"
          check dispensary "${{ needs.detect-changes.outputs.dispensary }}" "${{ needs.dispensary-checks.result }}"
          check admin "${{ needs.detect-changes.outputs.admin }}" "${{ needs.admin-checks.result }}"
          echo "CI OK"

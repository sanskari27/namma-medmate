name: CI Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pharmacy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: namma-pharmacy/package-lock.json
      - name: Pharmacy dashboard
        working-directory: namma-pharmacy
        run: npm ci && npm run typecheck && npm run build

  website-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medmate-website/package-lock.json
      - name: Website build
        working-directory: medmate-website
        env:
          SITE_URL: https://medmatepharmacy.com
        run: npm ci && npm run build

  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compose
        run: make compose-config

  ci-ok:
    needs: [pharmacy-checks, website-checks, meta]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require listed gates
        run: |
          set -euo pipefail
          [[ "${{ needs.pharmacy-checks.result }}" == success ]]
          [[ "${{ needs.website-checks.result }}" == success ]]
          [[ "${{ needs.meta.result }}" == success ]]
          echo "CI OK"

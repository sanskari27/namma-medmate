name: Deploy lambda
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      environment:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run ${{ inputs.project }}:build
      - run: |
          set -euo pipefail
          PROJECT="${{ inputs.project }}"
          ROOT="$(pnpm exec nx show project "$PROJECT" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).root))')"
          ZIP="${ROOT}/dist/handler.zip"
          test -f "$ZIP"
          FUNCTION="namma-medmate-${{ inputs.environment }}-${PROJECT}"
          aws lambda update-function-code --function-name "$FUNCTION" --zip-file "fileb://${ZIP}"
          aws lambda wait function-updated --function-name "$FUNCTION"

# Production — EC2 only. .env is pulled from SSM at deploy (scripts/pull-prod-env.sh).
# Loopback port for host Nginx: website 10082

name: ${COMPOSE_PROJECT_NAME:-namma-medmate-prod}

services:
  website:
    build:
      context: ./medmate-website
      dockerfile: Dockerfile
      args:
        SITE_URL: ${WEBSITE_SITE_URL:-https://medmatepharmacy.com}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.nammamedmate.com}
    image: ${NAMMA_WEBSITE_IMAGE:-namma-medmate-website:prod}
    restart: unless-stopped
    ports:
      - '127.0.0.1:10082:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

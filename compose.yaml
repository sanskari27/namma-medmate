# Local development — Namma MedMate (pharmacy ERP + CRM).
# Run: make up  OR  make deps && make backend && make dispensary && make admin
#
# Ports: Postgres 25432, Redis 16379, API 8080, dispensary 5173, admin 5174
# Server DATABASE_URL is hardcoded to compose postgres — never RDS on local.

name: ${COMPOSE_PROJECT_NAME:-namma-medmate-local}

services:
  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nammamedmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      - '25432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nammamedmate']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-min-64-chars-for-hs512-algorithm-change-in-prod-now}
      DATABASE_URL: jdbc:postgresql://postgres:5432/nammamedmate
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  dispensary:
    build:
      context: ./dispensary
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      server:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '5174:5174'
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_DEV_PORT: '5174'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data: {}

components:
  schemas:
    ActorSurface:
      type: string
      enum:
        - pharmacy
        - hq
        - kiosk
        - system
    IngestAuditEventRequest:
      type: object
      additionalProperties: false
      required:
        - actor_user_id
        - actor_role
        - actor_surface
        - action
        - target_type
        - target_id
        - money_or_stock
      properties:
        idempotency_key:
          type: string
        tenant_id:
          type: string
          format: uuid
          nullable: true
        location_id:
          type: string
          format: uuid
          nullable: true
        actor_user_id:
          type: string
        actor_role:
          type: string
        actor_surface:
          $ref: '#/components/schemas/ActorSurface'
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        money_or_stock:
          type: boolean
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        client_occurred_at:
          type: string
          format: date-time
        request_id:
          type: string
    IngestAuditEvent:
      type: object
      additionalProperties: false
      required:
        - audit_event_id
        - occurred_at
        - deduped
      properties:
        audit_event_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        deduped:
          type: boolean
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - audit_event_id
        - actor_user_id
        - actor_role
        - actor_surface
        - action
        - target_type
        - target_id
        - money_or_stock
        - occurred_at
      properties:
        audit_event_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
        location_id:
          type: string
          format: uuid
          nullable: true
        actor_user_id:
          type: string
        actor_role:
          type: string
        actor_surface:
          $ref: '#/components/schemas/ActorSurface'
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        money_or_stock:
          type: boolean
        before:
          type: object
          additionalProperties: true
          nullable: true
        after:
          type: object
          additionalProperties: true
          nullable: true
        occurred_at:
          type: string
          format: date-time
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true
    IngestAuditEventSuccess:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/IngestAuditEvent'
    ListAuditEventsSuccess:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/AuditEventPage'
    GetAuditEventSuccess:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/AuditEvent'
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            i18n_key:
              type: string
            details:
              type: object
              additionalProperties: true
    StaffRole:
      type: string
      enum:
        - Owner
        - Manager
        - Pharmacist
        - Cashier
    PinPurpose:
      type: string
      enum:
        - kiosk_exit
        - fefo_override
        - below_cost
        - credit_limit
        - saved_device_unlock
    PasswordLoginRequest:
      type: object
      additionalProperties: false
      required:
        - login_id
        - password
      properties:
        login_id:
          type: string
        password:
          type: string
        remember_device:
          type: boolean
    OtpRequest:
      type: object
      additionalProperties: false
      required:
        - login_id
      properties:
        login_id:
          type: string
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - login_id
        - challenge_id
        - otp
      properties:
        login_id:
          type: string
        challenge_id:
          type: string
        otp:
          type: string
        remember_device:
          type: boolean
    PinVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
        - pin
      properties:
        purpose:
          $ref: '#/components/schemas/PinPurpose'
        pin:
          type: string
        device_token:
          type: string
          nullable: true
        kiosk_session_id:
          type: string
          nullable: true
        login_id:
          type: string
    LoginSession:
      type: object
      additionalProperties: false
      required:
        - session_token
        - session_id
        - user_id
        - tenant_id
        - location_id
        - role
        - password_enabled
        - otp_enabled
        - device_token
      properties:
        session_token:
          type: string
        session_id:
          type: string
        user_id:
          type: string
        tenant_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/StaffRole'

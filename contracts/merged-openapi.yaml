openapi: 3.0.3
info:
  title: Namma MedMate merged API
  version: 0.1.0
paths:
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Return the authenticated session identity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSuccess'
              examples:
                authenticated:
                  value:
                    success: true
                    data:
                      authenticated: true
                      sub: user-1
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                malformed:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Must be a Bearer token
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missing:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Missing Authorization header
                invalid:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Invalid access token
components:
  schemas:
    SessionSuccess:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/SessionIdentity'
    SessionIdentity:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - sub
      properties:
        authenticated:
          type: boolean
          enum:
            - true
        sub:
          type: string
          minLength: 1
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
  parameters:
    AuthorizationHeader:
      name: authorization
      in: header
      required: true
      schema:
        type: string
        pattern: ^Bearer\s+\S+$
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

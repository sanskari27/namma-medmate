openapi: 3.0.3
info:
  title: Namma MedMate merged API
  version: 0.1.0
paths:
  /audit/events:
    post:
      operationId: ingestAuditEvent
      summary: Ingest an append-only audit event (service token)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestAuditEventRequest'
      responses:
        '200':
          description: Deduped existing event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAuditEventSuccess'
        '201':
          description: Event inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAuditEventSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listAuditEvents
      summary: Query audit events newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Values above 200 are capped to 200.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        '200':
          description: Newest-first page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAuditEventsSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /audit/events/{audit_event_id}:
    get:
      operationId: getAuditEvent
      summary: Get one audit event
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: audit_event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuditEventSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Return the authenticated session identity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSuccess'
              examples:
                authenticated:
                  value:
                    success: true
                    data:
                      authenticated: true
                      sub: user-1
        '400':
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                malformed:
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Must be a Bearer token
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missing:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Missing Authorization header
                invalid:
                  value:
                    success: false
                    error:
                      code: UNAUTHORIZED
                      message: Invalid access token
  /master-catalogue/skus:
    get:
      operationId: listMasterSkus
      summary: List and filter platform master SKUs (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: category
          in: query
          schema:
            type: string
        - name: schedule
          in: query
          schema:
            $ref: '#/components/schemas/Schedule'
        - name: gst_slab
          in: query
          schema:
            $ref: '#/components/schemas/GstSlab'
        - name: rx_only
          in: query
          schema:
            type: boolean
        - name: banned
          in: query
          schema:
            type: boolean
        - name: q
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: location_id
          in: query
          description: Ignored. Resource is platform-scoped.
          schema:
            type: string
      responses:
        '200':
          description: Page of master SKUs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMasterSkusSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: createMasterSku
      summary: Add a platform master SKU (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMasterSkuRequest'
      responses:
        '201':
          description: Created master SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterSkuSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}:
    get:
      operationId: getMasterSku
      summary: Get a master SKU with substitutes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
        - name: location_id
          in: query
          description: Ignored. Resource is platform-scoped.
          schema:
            type: string
      responses:
        '200':
          description: Master SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterSkuDetailSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchMasterSku
      summary: Patch catalogue fields (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMasterSkuRequest'
      responses:
        '200':
          description: Updated master SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterSkuSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}/stocking-pharmacies:
    get:
      operationId: listStockingPharmacies
      summary: Pharmacies currently mapped to this master (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      responses:
        '200':
          description: Stocking pharmacies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockingPharmaciesSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}/ceiling:
    put:
      operationId: putMasterSkuCeiling
      summary: Set or clear DPCO ceiling (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCeilingRequest'
      responses:
        '200':
          description: Updated master SKU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterSkuSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}/ban:
    post:
      operationId: banMasterSku
      summary: Ban a master SKU platform-wide (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BanRequest'
      responses:
        '200':
          description: Banned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}/unban:
    post:
      operationId: unbanMasterSku
      summary: Un-ban a master SKU (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      responses:
        '200':
          description: Unbanned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbanSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}/substitutes:
    put:
      operationId: putMasterSkuSubstitutes
      summary: Replace ordered substitutes (HQ)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSubstitutesRequest'
      responses:
        '200':
          description: Ordered substitutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutesSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: getMasterSkuSubstitutes
      summary: List substitutes; for_pos=true omits banned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
        - name: for_pos
          in: query
          schema:
            type: boolean
        - name: location_id
          in: query
          description: Ignored. Resource is platform-scoped.
          schema:
            type: string
      responses:
        '200':
          description: Substitutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubstitutesSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /master-catalogue/skus/{platform_master_sku_id}/assert-price:
    post:
      operationId: assertMasterSkuPrice
      summary: Assert unit price against DPCO ceiling and banned flag
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/PlatformMasterSkuId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssertPriceRequest'
      responses:
        '200':
          description: Price assertion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertPriceSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /tenancy/pharmacies:
    post:
      operationId: createPharmacy
      summary: Create a Pharmacy and its single Location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePharmacyRequest'
      responses:
        '201':
          description: Pharmacy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPharmacySuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    get:
      operationId: listPharmacies
      summary: List pharmacies for HQ
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of pharmacies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyListSuccess'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /tenancy/pharmacies/{tenant_id}:
    get:
      operationId: getPharmacy
      summary: Get a Pharmacy and its Location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Pharmacy with location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacySuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /tenancy/pharmacies/{tenant_id}/locations:
    post:
      operationId: createLocation
      summary: Reject a second Location in v1
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /tenancy/current:
    get:
      operationId: getCurrentPharmacy
      summary: Load the session Pharmacy and Location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/LocationIdQuery'
      responses:
        '200':
          description: Current pharmacy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacySuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: patchCurrentPharmacy
      summary: Owner updates Location display_name
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/LocationIdQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCurrentRequest'
      responses:
        '200':
          description: Updated pharmacy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacySuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /tenancy/locations/{location_id}:
    get:
      operationId: getLocation
      summary: Resolve shop name and tenant pairing
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/LocationIdPath'
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Location identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /whatsapp/messages:
    post:
      operationId: sendWhatsAppMessage
      summary: Queue a transactional or campaign WhatsApp send
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Deduped existing message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageSuccess'
        '202':
          description: Accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    get:
      operationId: listWhatsAppMessages
      summary: List inbox rows for a pharmacy location
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/LocationIdQuery'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MessageStatus'
        - name: template_key
          in: query
          schema:
            $ref: '#/components/schemas/TemplateKey'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Inbox page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /whatsapp/mandatory-failures:
    get:
      operationId: listWhatsAppMandatoryFailures
      summary: Unacknowledged mandatory failed sends for the banner
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/LocationIdQuery'
      responses:
        '200':
          description: Mandatory failures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandatoryFailuresSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /whatsapp/messages/{message_id}/acknowledge:
    post:
      operationId: acknowledgeWhatsAppMessage
      summary: Owner acknowledges a mandatory failure
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: message_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeRequest'
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /whatsapp/share-deeplink:
    post:
      operationId: createWhatsAppShareDeeplink
      summary: Build a wa.me URL without sending
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareDeeplinkRequest'
      responses:
        '200':
          description: Deeplink
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareDeeplinkSuccess'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /whatsapp/templates:
    get:
      operationId: listWhatsAppTemplates
      summary: Read-only template catalogue
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
      responses:
        '200':
          description: Catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesSuccess'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /whatsapp/webhooks/meta:
    post:
      operationId: receiveWhatsAppMetaWebhook
      summary: Meta Cloud API status callback
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAckSuccess'
        '401':
          $ref: '#/components/responses/Error'
components:
  schemas:
    ActorSurface:
      type: string
      enum:
        - pharmacy
        - hq
        - kiosk
        - system
    IngestAuditEventRequest:
